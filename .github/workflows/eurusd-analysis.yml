name: EUR/USD Analysis

on:
  workflow_dispatch:

concurrency:
  group: eurusd-analysis        # never two runs stepping on each other

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10          # a hung pipeline must die loudly

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright pillow numpy
          playwright install --with-deps chromium

      - name: Capture TradingView
        run: python tradingview_capture.py   # retry-until-non-blank logic goes in the script

      - name: Validate evidence (content, not existence)
        run: |
          python - <<'EOF'
          from PIL import Image
          import numpy as np
          img = np.array(Image.open("evidence/eurusd_tradingview.png").convert("L"))
          print("pixel std:", round(float(img.std()), 2))
          assert img.std() > 20, "BLANK CHART — capture invalid"
          EOF

      - name: Upload TradingView evidence
        uses: actions/upload-artifact@v4
        with:
          name: tradingview-evidence
          path: evidence/eurusd_tradingview.png
          if-no-files-found: error

      - name: Run EUR/USD bot
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python eurusd_bot.py            # must write message.txt

      - name: Send Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram.py --file message.txt